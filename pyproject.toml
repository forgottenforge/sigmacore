[build-system]
requires = ["setuptools>=45", "wheel", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-c-framework"
version = "4.1.1"
description = "Susceptibility-based scale selection: disciplined-reader kernel (v4) implementing the foundation paper (Zenodo doi:10.5281/zenodo.20548818) plus multi-adapter applications stack (v1-v3) across Quantum, GPU, Financial, Climate, Seismic, Magnetic, Number Theory, Protein, ML, Edge, and LLM-cost domains."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-or-later OR Commercial"}
authors = [
    {name = "ForgottenForge", email = "nfo@forgottenforge.xyz"}
]
keywords = ["scale-selection", "susceptibility", "regime-trichotomy", "transfer-operator", "spectral-gap", "operational-scale", "critical-phenomena", "phase-transitions", "contraction-geometry", "quantum-computing", "statistical-physics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "requests>=2.25.0",
    "yfinance>=0.1.63",
    "pynvml>=11.0.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = ["amazon-braket-sdk>=1.9.0", "qiskit>=0.45", "cirq>=1.0", "pennylane>=0.30"]
gpu = ["cupy>=9.0.0"]
finance = ["QuantLib>=1.30"]
all = [
    "amazon-braket-sdk>=1.9.0",
    "qiskit>=0.45",
    "cirq>=1.0",
    "pennylane>=0.30",
    "cupy>=9.0.0",
    "QuantLib>=1.30",
]
dev = ["pytest>=6.0", "black>=21.0", "mypy>=0.900"]

[project.urls]
Homepage = "https://github.com/forgottenforge/sigmacore"
Documentation = "https://github.com/forgottenforge/sigmacore/blob/main/DOCUMENTATION.md"
Repository = "https://github.com/forgottenforge/sigmacore"
Issues = "https://github.com/forgottenforge/sigmacore/issues"

[tool.setuptools]
packages = [
    "sigma_c",
    "sigma_c.core",
    "sigma_c.adapters",
    "sigma_c.stats",
    "sigma_c.optimization",
    "sigma_c.physics",
    "sigma_c.connectors",
    "sigma_c.ml",
    "sigma_c.finance",
    "sigma_c.monitoring",
    "sigma_c.visualization",
    "sigma_c.plotting",
    "sigma_c.reporting",
    "sigma_c.prediction",
    "sigma_c.plugins",
    "sigma_c.api",
    "sigma_c.integrations",
    "sigma_c.beyond",
    # v4 disciplined-reader kernel
    "sigma_c_v4",
    "sigma_c_v4.adapters",
    "sigma_c_v4.core",
    "sigma_c_v4.examples",
    "sigma_c_v4.tests",
    "sigma_c_v4.windows",
]

[tool.setuptools.package-data]
sigma_c_v4 = ["*.md", "examples/*.py", "examples/*.md"]
